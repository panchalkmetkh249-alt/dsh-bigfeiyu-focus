<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="大肥鱼视线跟随">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccdff"/>
      <stop offset="1" stop-color="#2a7ccd"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b93e2"/>
      <stop offset="1" stop-color="#1f63a8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 尾鳍：朝右摆，强调「正在转头」的动态 -->
  <path d="M97 64c9-11 16-17 23-19-2 12-2 26 0 38-7-2-14-8-23-19z" fill="url(#tail)"/>

  <!-- 身体 -->
  <ellipse cx="56" cy="66" rx="43" ry="34" fill="url(#body)"/>
  <ellipse cx="56" cy="74" rx="35" ry="23" fill="#d6efff" opacity=".42"/>
  <ellipse cx="56" cy="64" rx="43" ry="34" fill="url(#shine)"/>

  <!-- 胸鳍 -->
  <path d="M60 84c6 3 10 8 11 14-7-1-12-5-15-10z" fill="#2f8ade" opacity=".9"/>

  <!-- 眼睛：瞳孔整体偏向光标方向（右上），眼白略扁 -->
  <ellipse cx="41" cy="58" rx="10" ry="11" fill="#ffffff"/>
  <ellipse cx="71" cy="58" rx="10" ry="11" fill="#ffffff"/>
  <circle cx="44.5" cy="54.5" r="5" fill="#10233c"/>
  <circle cx="74.5" cy="54.5" r="5" fill="#10233c"/>
  <circle cx="46.4" cy="52.4" r="1.7" fill="#ffffff"/>
  <circle cx="76.4" cy="52.4" r="1.7" fill="#ffffff"/>

  <!-- 腮线 -->
  <path d="M32 64c-3 6-3 12 1 17" stroke="#1f63a8" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>

  <!-- 嘴 -->
  <path d="M50 80c4 3.2 9 3.2 13 0" stroke="#1b5b9b" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- 光标提示：右下角的小箭头，点题「看鼠标」 -->
  <path d="M92 88l22 9-9 2.6 5.4 11.4-5.6 2.6-5.4-11.5-6.4 6.4z" fill="#f4f9ff" stroke="#1b4f86" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
